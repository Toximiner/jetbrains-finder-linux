name: Build Linux extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify bundled search engine
        run: node -e 'const {execFileSync}=require("node:child_process"); console.log(execFileSync(require("@vscode/ripgrep").rgPath,["--version"],{encoding:"utf8"}));'
      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'if (process.env.GITHUB_REF_NAME !== `v${require("./package.json").version}`) throw new Error("Tag must match version")'
      - run: npm run package
      - run: sha256sum *.vsix > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: jetbrains-finder-linux-x64
          path: |
            *.vsix
            SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: jetbrains-finder-linux-x64
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "JetBrains Finder Linux $GITHUB_REF_NAME" --generate-notes
